<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - ONG</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <a href="#conteudo" class="pular-link">Pular para o conteúdo</a>

    <header>
        <div class="container">
            <a href="index.html" class="logo">ONG</a>
            <nav aria-label="Menu principal">
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="projetos.html">Projetos</a></li>
                    <li><a href="cadastro.html" aria-current="page">Cadastro</a></li>
                </ul>
            </nav>
            <button type="button" id="botao-contraste" class="botao-contraste" aria-pressed="false">Alto contraste</button>
        </div>
    </header>

    <main id="conteudo" tabindex="-1">
        <section id="cadastro" class="cadastro-secao">
            <div class="container">
                <h1>Cadastro</h1>
                <p>Preencha seus dados para se tornar voluntário ou colaborador da nossa causa.</p>

                <form action="/processa-cadastro" method="POST">

                    <fieldset>
                        <legend>Dados Pessoais</legend>

                        <div class="campo">
                            <label for="nome">Nome completo</label>
                            <input type="text" id="nome" name="nome" required minlength="3" autocomplete="name">
                        </div>

                        <div class="campo">
                            <label for="email">E-mail</label>
                            <input type="email" id="email" name="email" required autocomplete="email">
                        </div>

                        <div class="campo">
                            <label for="nascimento">Data de nascimento</label>
                            <input type="date" id="nascimento" name="nascimento" required max="2010-01-01">
                        </div>

                        <div class="campo">
                            <label for="cpf">CPF</label>
                            <input type="text" id="cpf" name="cpf" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="000.000.000-00" aria-describedby="cpf-dica">
                            <small id="cpf-dica" class="dica">Formato: 000.000.000-00</small>
                        </div>

                        <div class="campo">
                            <label for="telefone">Telefone</label>
                            <input type="tel" id="telefone" name="telefone" required pattern="\(\d{2}\) \d{5}-\d{4}" placeholder="(11) 99999-9999" aria-describedby="telefone-dica">
                            <small id="telefone-dica" class="dica">Formato: (11) 99999-9999</small>
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>Endereço</legend>

                        <div class="campo">
                            <label for="cep">CEP</label>
                            <input type="text" id="cep" name="cep" required pattern="\d{5}-\d{3}" placeholder="00000-000" aria-describedby="cep-dica">
                            <small id="cep-dica" class="dica">Formato: 00000-000</small>
                        </div>

                        <div class="campo">
                            <label for="endereco">Endereço</label>
                            <input type="text" id="endereco" name="endereco" required autocomplete="street-address">
                        </div>

                        <div class="campo">
                            <label for="cidade">Cidade</label>
                            <input type="text" id="cidade" name="cidade" required autocomplete="address-level2">
                        </div>

                        <div class="campo">
                            <label for="estado">Estado</label>
                            <select id="estado" name="estado" required autocomplete="address-level1">
                                <option value="">Selecione</option>
                                <option value="SP">São Paulo</option>
                                <option value="PR">Paraná</option>
                                <option value="RJ">Rio de Janeiro</option>
                                <option value="MG">Minas Gerais</option>
                                <!-- demais estados -->
                            </select>
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>Confirmação</legend>

                        <div class="campo checkbox">
                            <input type="checkbox" id="termos" name="termos" required>
                            <label for="termos">Li e aceito os termos de uso e a política de privacidade</label>
                        </div>

                        <button type="submit">Cadastrar</button>
                    </fieldset>

                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 ONG. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="js/acessibilidade.js"></script>
</body>
</html>
